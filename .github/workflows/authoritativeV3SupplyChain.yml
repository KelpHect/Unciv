name: Authoritative v3 supply-chain security

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - 'codex/**'
    tags:
      - 'authoritative-v3-*'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: authoritative-v3-supply-chain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the complete dependency change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  secret-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan current tree and history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_VERSION: '8.30.1'

  rust-vulnerability-audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - name: Check out locked Rust dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit RustSec advisories
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}
          working-directory: authoritative-server

  source-sbom:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: authoritative-v3-source.spdx.json
          syft-version: v1.49.0
          artifact-name: authoritative-v3-source-sbom
          upload-artifact: true
          upload-artifact-retention: 30
          upload-release-assets: false

  jvm-dependency-submission:
    if: >-
      github.event_name == 'schedule' ||
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Submit the resolved Gradle dependency graph
        uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

  tagged-release-evidence:
    if: startsWith(github.ref, 'refs/tags/authoritative-v3-')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Build every production bundle input
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.0 --profile minimal --no-self-update
          ./gradlew --no-daemon :server:authoritativeWorkerDist :desktop:dist
          cargo +1.97.0 build --locked --release \
            --manifest-path authoritative-server/Cargo.toml \
            --bin unciv-authoritative-server \
            --bin unciv-v3-migrate \
            --bin unciv-v3-export-security-audit \
            --bin unciv-v3-bundle \
            --bin unciv-v3-rulesets \
            --bin unciv-v3-load
      - name: Derive and validate the exact vanilla ruleset manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-inputs
          (
            cd android/assets
            java -jar ../../server/build/libs/UncivAuthoritativeWorker.jar \
              --print-catalog
          ) | tee release-inputs/catalog.log
          tail --lines=1 release-inputs/catalog.log > release-inputs/catalog.json
          jq -e '
            .valid == true and
            ([.installedRulesets[] | select(.name == "Civ V - Vanilla")] | length == 1)
          ' release-inputs/catalog.json >/dev/null
          jq -e '{
            engineBuild,
            baseRuleset: (
              .installedRulesets[] | select(.name == "Civ V - Vanilla")
            ),
            mods: []
          }' release-inputs/catalog.json > release-inputs/ruleset-manifest.json
          (
            cd android/assets
            java -jar ../../server/build/libs/UncivAuthoritativeWorker.jar \
              --validate-manifest ../../release-inputs/ruleset-manifest.json
          ) >/dev/null
      - name: Generate and verify the production bundle
        shell: bash
        env:
          SYFT_VERSION: '1.49.0'
          SYFT_LINUX_AMD64_SHA256: 7aa2f03ee92739cf643279ba3990548b9925d4e22cae13f46831ee62821147fe
        run: |
          set -euo pipefail
          cp authoritative-server/target/release/unciv-authoritative-server \
            release-inputs/unciv-authoritative-server
          cp authoritative-server/target/release/unciv-v3-migrate \
            release-inputs/unciv-v3-migrate
          cp authoritative-server/target/release/unciv-v3-export-security-audit \
            release-inputs/unciv-v3-export-security-audit
          cp authoritative-server/target/release/unciv-v3-bundle \
            release-inputs/unciv-v3-bundle
          cp authoritative-server/target/release/unciv-v3-rulesets \
            release-inputs/unciv-v3-rulesets
          cp server/build/libs/UncivAuthoritativeWorker.jar \
            release-inputs/UncivAuthoritativeWorker.jar
          cp desktop/build/libs/Unciv.jar release-inputs/Unciv.jar
          rm release-inputs/catalog.json release-inputs/catalog.log

          curl --fail --location --silent --show-error \
            --output syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_LINUX_AMD64_SHA256}  syft.tar.gz" | sha256sum --check
          mkdir syft-bin
          tar --extract --gzip --file syft.tar.gz --directory syft-bin syft
          ./syft-bin/syft scan dir:release-inputs \
            --source-name unciv-authoritative-v3-release-bundle \
            --output spdx-json=release-inputs.spdx.json

          authoritative-server/target/release/unciv-v3-bundle \
            verify-sbom release-inputs.spdx.json
          mkdir release-output
          authoritative-server/target/release/unciv-v3-bundle create \
            release-output/bundle \
            release-inputs/unciv-authoritative-server \
            release-inputs/unciv-v3-migrate \
            release-inputs/unciv-v3-export-security-audit \
            release-inputs/unciv-v3-bundle \
            release-inputs/unciv-v3-rulesets \
            release-inputs/UncivAuthoritativeWorker.jar \
            release-inputs/Unciv.jar \
            release-inputs/ruleset-manifest.json \
            release-inputs.spdx.json
          authoritative-server/target/release/unciv-v3-bundle \
            verify release-output/bundle

          bash authoritative-server/tests/run-linux-production-smoke.sh \
            release-output/bundle

          bash authoritative-server/tests/run-linux-low-resource-load.sh \
            release-output/bundle \
            authoritative-server/target/release/unciv-v3-load \
            > release-output/low-resource-load.json

          source_date_epoch="$(git show -s --format=%ct HEAD)"
          tar --sort=name --mtime="@${source_date_epoch}" \
            --owner=0 --group=0 --numeric-owner \
            --create --gzip --file=authoritative-v3-linux-x86_64.tar.gz \
            --directory=release-output bundle
          sha256sum authoritative-v3-linux-x86_64.tar.gz \
            > authoritative-v3-linux-x86_64.tar.gz.sha256
      - name: Sign production bundle provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: authoritative-v3-linux-x86_64.tar.gz
      - name: Bind the SPDX SBOM to the production bundle
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: authoritative-v3-linux-x86_64.tar.gz
          sbom-path: release-output/bundle/evidence/sbom.spdx.json
      - name: Retain the attested evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authoritative-v3-linux-x86_64-release
          path: |
            authoritative-v3-linux-x86_64.tar.gz
            authoritative-v3-linux-x86_64.tar.gz.sha256
            release-output/bundle/bundle-manifest.json
            release-output/bundle/evidence/sbom.spdx.json
            release-output/low-resource-load.json
          if-no-files-found: error
          retention-days: 90
