name: Dependabot alert dismissal rationale

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

concurrency:
  group: dependabot-alert-rationale-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  vulnerability-alerts: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the rationale checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the checker's analysis logic
        run: python3 .github/workflows/check-dependabot-alert-rationales.py --self-test
      - name: Fetch dismissed Dependabot alerts with gh
        env:
          # gh authenticates with the workflow GITHUB_TOKEN. The
          # `vulnerability-alerts: read` permission above grants it the
          # "Read Dependabot alerts" capability, so no PAT secret is needed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate \
            "repos/${{ github.repository }}/dependabot/alerts?state=dismissed&per_page=100" \
            > dismissed-alerts.json
      - name: Fail on manually-dismissed alerts without a rationale
        run: python3 .github/workflows/check-dependabot-alert-rationales.py dismissed-alerts.json
