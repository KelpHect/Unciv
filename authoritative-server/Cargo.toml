[package]
name = "unciv-authoritative-server"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "=0.3.32"
hmac = { version = "0.13.0", features = ["zeroize"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.11"
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid"] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.21", features = ["serde", "v4"] }
utoipa = { version = "=5.5.0", features = ["uuid"] }
zstd = "0.13.3"
zeroize = { version = "1.8", features = ["derive"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = "1.11.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync"] }
tower = { version = "0.5.2", features = ["util"] }
