name: Authoritative v3 supply-chain security

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - 'codex/**'
    tags:
      - 'authoritative-v3-*'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: authoritative-v3-supply-chain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the complete dependency change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  secret-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan current tree and history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_VERSION: '8.30.1'

  rust-vulnerability-audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - name: Check out locked Rust dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit RustSec advisories
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}
          working-directory: authoritative-server

  source-sbom:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: authoritative-v3-source.spdx.json
          syft-version: v1.49.0
          artifact-name: authoritative-v3-source-sbom
          upload-artifact: true
          upload-artifact-retention: 30
          upload-release-assets: false

  jvm-dependency-submission:
    if: >-
      github.event_name == 'schedule' ||
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Submit the resolved Gradle dependency graph
        uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

  tagged-release-evidence:
    if: startsWith(github.ref, 'refs/tags/authoritative-v3-')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create the exact tagged source archive
        shell: bash
        run: git archive --format=tar.gz --output=authoritative-v3-source.tar.gz HEAD
      - name: Generate the release SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: authoritative-v3-release.spdx.json
          syft-version: v1.49.0
          upload-artifact: false
          upload-release-assets: false
      - name: Sign provenance and bind the SBOM to the source archive
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: authoritative-v3-source.tar.gz
          sbom-path: authoritative-v3-release.spdx.json
      - name: Retain the attested evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authoritative-v3-tagged-release-evidence
          path: |
            authoritative-v3-source.tar.gz
            authoritative-v3-release.spdx.json
          if-no-files-found: error
          retention-days: 90
