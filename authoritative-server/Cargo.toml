[package]
name = "unciv-authoritative-server"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[lints.rust]
# MSVC reports the import-library creation status on stdout. Rust 1.97
# classifies that localized, successful linker status as a warning.
linker_messages = "allow"

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["ws"] }
dunce = "1.0.5"
futures-util = "=0.3.32"
hmac = { version = "0.13.0", features = ["zeroize"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.11"
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid"] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "=0.29.0"
tower-http = { version = "0.6.8", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.21", features = ["serde", "v4", "v5"] }
utoipa = { version = "=5.5.0", features = ["uuid"] }
zstd = "0.13.3"
zeroize = { version = "1.8", features = ["derive"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = "1.11.0"
serde_yaml_ng = "0.10.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync"] }
tower = { version = "0.5.2", features = ["util"] }
