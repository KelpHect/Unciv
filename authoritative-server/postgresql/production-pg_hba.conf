# Local emergency administration is restricted to the postgres OS identity.
local   all                  postgres                               peer

# Every TCP application, migration, backup, and audit session is TLS-only.
hostnossl all                all                 0.0.0.0/0           reject
hostnossl all                all                 ::0/0               reject
hostssl unciv_authoritative  unciv_runtime       127.0.0.1/32        scram-sha-256
hostssl unciv_authoritative  unciv_runtime       ::1/128             scram-sha-256
hostssl unciv_authoritative  unciv_migrate       127.0.0.1/32        scram-sha-256
hostssl unciv_authoritative  unciv_migrate       ::1/128             scram-sha-256
hostssl unciv_authoritative  unciv_audit         127.0.0.1/32        scram-sha-256
hostssl unciv_authoritative  unciv_audit         ::1/128             scram-sha-256
hostssl replication         unciv_backup        127.0.0.1/32        scram-sha-256
hostssl replication         unciv_backup        ::1/128             scram-sha-256
