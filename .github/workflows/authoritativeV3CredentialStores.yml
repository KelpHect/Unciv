name: Authoritative v3 credential stores

on:
  pull_request:
    paths:
      - '.github/workflows/authoritativeV3CredentialStores.yml'
      - 'android/androidTest/**'
      - 'android/build.gradle.kts'
      - 'android/src/com/unciv/app/AndroidApiV3SessionTokenStore.kt'
      - 'authoritative-server/tests/credential_store_workflow_policy.rs'
      - 'desktop/src/com/unciv/app/desktop/*ApiV3SessionTokenStore.kt'
      - 'desktop/src/com/unciv/app/desktop/DesktopGame.kt'
      - 'gradle/libs.versions.toml'
      - 'tests/src/com/unciv/app/desktop/*ApiV3SessionTokenStoreTests.kt'
      - 'tests/src/com/unciv/logic/multiplayer/authoritative/AuthoritativeProductionRoutingTests.kt'
  push:
    branches:
      - master
      - main
      - 'codex/**'
    paths:
      - '.github/workflows/authoritativeV3CredentialStores.yml'
      - 'android/androidTest/**'
      - 'android/build.gradle.kts'
      - 'android/src/com/unciv/app/AndroidApiV3SessionTokenStore.kt'
      - 'authoritative-server/tests/credential_store_workflow_policy.rs'
      - 'desktop/src/com/unciv/app/desktop/*ApiV3SessionTokenStore.kt'
      - 'desktop/src/com/unciv/app/desktop/DesktopGame.kt'
      - 'gradle/libs.versions.toml'
      - 'tests/src/com/unciv/app/desktop/*ApiV3SessionTokenStoreTests.kt'
      - 'tests/src/com/unciv/logic/multiplayer/authoritative/AuthoritativeProductionRoutingTests.kt'
  workflow_dispatch:

concurrency:
  group: authoritative-v3-credential-stores-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-secure-store:
    name: Desktop secure store (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Exercise macOS Keychain
        if: runner.os == 'macOS'
        run: ./gradlew :tests:test --tests com.unciv.app.desktop.MacOsApiV3SessionTokenStoreTests
      - name: Install Linux Secret Service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes dbus-x11 gnome-keyring libsecret-tools
      - name: Exercise Linux Secret Service
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            eval "$(printf %s unciv-ci-keyring | gnome-keyring-daemon --unlock --components=secrets)"
            ./gradlew :tests:test --tests com.unciv.app.desktop.LinuxApiV3SessionTokenStoreTests
          '

  android-keystore:
    name: Android Keystore (API ${{ matrix.api-level }})
    strategy:
      fail-fast: false
      matrix:
        api-level:
          - 21
          - 23
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: Install exact Android emulator image
        env:
          API_LEVEL: ${{ matrix.api-level }}
        run: |
          ANDROID_AVD_HOME="$RUNNER_TEMP/unciv-avd"
          export ANDROID_AVD_HOME
          mkdir -p "$ANDROID_AVD_HOME"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            'platform-tools' \
            'emulator' \
            'platforms;android-36' \
            "system-images;android-${API_LEVEL};default;x86_64"
          echo no | avdmanager create avd \
            --force \
            --name unciv-api-v3 \
            --device pixel \
            --package "system-images;android-${API_LEVEL};default;x86_64"
          test -f "$ANDROID_AVD_HOME/unciv-api-v3.ini"
      - name: Boot emulator and exercise Android Keystore
        run: |
          sudo chmod 0666 /dev/kvm
          ANDROID_AVD_HOME="$RUNNER_TEMP/unciv-avd"
          export ANDROID_AVD_HOME
          ADB="$ANDROID_SDK_ROOT/platform-tools/adb"
          EMULATOR="$ANDROID_SDK_ROOT/emulator/emulator"
          nohup "$EMULATOR" \
            -avd unciv-api-v3 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            >"$RUNNER_TEMP/unciv-emulator.log" 2>&1 &
          timeout 180 "$ADB" wait-for-device
          timeout 300 bash -c \
            'until [ "$("$ANDROID_SDK_ROOT/platform-tools/adb" shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          "$ADB" shell input keyevent 82
          ./gradlew :android:connectedDebugAndroidTest
      - name: Preserve emulator diagnostics
        if: failure()
        run: |
          cat "$RUNNER_TEMP/unciv-emulator.log" || true
          timeout 10 "$ANDROID_SDK_ROOT/platform-tools/adb" logcat -d '*:E' || true
