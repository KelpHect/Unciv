# Jobs to test the code base and build the client and server app
name: Build and test

on:
  # Triggers the workflow on any push or pull request
  push:
  # `pull_request`, NOT `pull_request_target`: this job builds and runs the PR's
  # own code (`./gradlew` executes the PR's build scripts), so it must run
  # against the merge result and must never be handed repository secrets.
  # Commenting failures back on the PR does need a base-repo token, so that step
  # lives in commentTestFailures.yml, which runs on `workflow_run` and never
  # checks out fork code.
  pull_request:

# No job here may write to the repository or reach the base repo's secrets.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # We only need the minimum

  code-checks:
    name: Check code and run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # On `pull_request` this is the PR's merge commit, on `push` the
          # pushed commit - never the bare base branch head.
          ref: ${{ github.sha }}

      - uses: actions/setup-java@v5
        with:
          cache: 'gradle'
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile kotlin and build classes
        run: ./gradlew classes

      - name: Run code checks
        id: run_checks
        continue-on-error: true
        run: |
          ./gradlew check 2>&1 | tee check_output.log
          echo "check_exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Extract test failures
        if: steps.run_checks.outputs.check_exit_code != '0'
        id: extract_failures
        run: |
          # Extract relevant failure information from check output
          FAILURE_CONTENT=$(awk '/FAILED|STANDARD_OUT/{p=1} p{print} /^[[:space:]]*$/ && p{p=0}' check_output.log | head -100)

          # Save to file, for the "Comment test failures" workflow to pick up
          echo "$FAILURE_CONTENT" > test_failures.txt
          echo "${{ github.event.pull_request.number }}" > pr_number.txt

      # `workflow_run` is not told which PR a fork run belongs to, so we hand
      # over both the failure text and the PR number as an artifact.
      - name: Upload test failures
        if: steps.run_checks.outputs.check_exit_code != '0' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: test-failures
          path: |
            test_failures.txt
            pr_number.txt
          retention-days: 1

      - name: Fail workflow if checks failed
        if: steps.run_checks.outputs.check_exit_code != '0'
        run: exit 1
