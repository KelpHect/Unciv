name: unciv-authoritative-postgresql

services:
  postgres:
    image: postgres:19beta2-alpine@sha256:bc62313e826eb44d5f608425b7665962b72820e686da017799e906604bfeb8a5
    container_name: unciv-authoritative-postgres
    restart: "no"
    environment:
      POSTGRES_DB: unciv_authoritative
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-bootstrap-password
      PGDATA: /var/lib/postgresql/data
    command:
      - postgres
      - -c
      - config_file=/etc/unciv-authoritative/postgres/postgresql.conf
    network_mode: host
    volumes:
      - /var/lib/unciv-authoritative/postgresql:/var/lib/postgresql
      - /etc/unciv-authoritative/postgres/postgresql.conf:/etc/unciv-authoritative/postgres/postgresql.conf:ro
      - /etc/unciv-authoritative/postgres/pg_hba.conf:/etc/unciv-authoritative/postgres/pg_hba.conf:ro
      - /etc/unciv-authoritative/postgres/tls:/etc/unciv-authoritative/postgres/tls:ro
      - /var/backups/unciv-authoritative/wal:/var/backups/unciv-authoritative/wal
      - /opt/unciv-authoritative/releases/current/postgresql:/opt/unciv-authoritative/releases/current/postgresql:ro
      - /etc/unciv-authoritative/postgres/postgres-bootstrap-password:/run/secrets/postgres-bootstrap-password:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          gosu postgres psql -d unciv_authoritative -Atc
          "SELECT current_setting('ssl') = 'on'" | grep -qx t
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    cpus: 0.40
    mem_limit: 384m
    mem_reservation: 256m
    pids_limit: 128
    shm_size: 64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
