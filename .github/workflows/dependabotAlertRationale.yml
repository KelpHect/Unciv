name: Dependabot alert dismissal rationale

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

concurrency:
  group: dependabot-alert-rationale-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the rationale checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the checker's analysis logic
        run: python3 .github/workflows/check-dependabot-alert-rationales.py --self-test
      - name: Fail on manually-dismissed alerts without a rationale
        env:
          # The Dependabot alerts API is not readable with GITHUB_TOKEN
          # (github/community#60612). Provide a token with the security_events
          # scope (public repos: public_repo) in the DEPENDABOT_AUDIT_TOKEN
          # repository secret.
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUDIT_TOKEN }}
        run: python3 .github/workflows/check-dependabot-alert-rationales.py "${{ github.repository }}"
