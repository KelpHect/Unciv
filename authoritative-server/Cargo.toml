[package]
name = "unciv-authoritative-server"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[dependencies]
argon2 = "0.5.3"
axum = "0.8.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid"] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.21", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync"] }
