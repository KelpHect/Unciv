[package]
name = "unciv-authoritative-server"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[dependencies]
axum = "0.8.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "sync"] }
uuid = { version = "1.21", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync"] }
