# PostgreSQL 19 Beta 2 authoritative recovery profile.
wal_level = replica
archive_mode = on
archive_timeout = '60s'
archive_command = 'UNCIV_V3_WAL_ARCHIVE_ROOT=/var/backups/unciv-authoritative/wal /bin/sh /opt/unciv-authoritative/releases/current/postgresql/archive-wal.sh "%p" "%f"'
max_wal_senders = 4
